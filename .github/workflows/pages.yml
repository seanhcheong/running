# =============================================================================
# Deploy to GitHub Pages
# =============================================================================
# Publishes the repo root as a static site, which is all this game needs: there
# is no build step, and every library is committed under vendor/.
#
# The point of deploying at all is HTTPS. Browsers only grant getUserMedia on a
# secure origin, so the camera — and therefore the entire game — cannot work
# from a plain http:// address on a phone.
#
# ---------------------------------------------------------------------------
# ONE-TIME MANUAL STEP, which this workflow cannot do for you
# ---------------------------------------------------------------------------
# Pages must already be switched on for the repo before this can deploy:
#
#     Settings -> Pages -> Source -> "GitHub Actions"
#
# An earlier version of this file tried to skip that with
# `configure-pages: enablement: true`, which failed:
#
#     Create Pages site failed. Error: Resource not accessible by integration
#
# Creating a Pages site needs admin scope, and the automatic GITHUB_TOKEN is
# never granted it — `permissions:` cannot ask for it either. So enabling Pages
# takes a human, a PAT with admin rights, or nothing at all.
#
# If the Settings -> Pages source options are greyed out entirely, Pages is
# blocked for the account (common on enterprise-managed accounts) and no
# workflow can work around it. Use a tunnel instead — see the README.
#
# Trigger is manual only, so the repo does not collect a failing run on every
# push while Pages is still off. Once it deploys successfully, add:
#
#     push:
#       branches: [claude/huffpuff-fitness-game-ozvn7c, main]
# =============================================================================
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a push is not lost.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the existing Pages config. It cannot create one — see the note at
      # the top of this file.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site. The action already excludes .git and
          # .github, and vendor/ must be included — those are the game's
          # libraries, not build inputs.
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
